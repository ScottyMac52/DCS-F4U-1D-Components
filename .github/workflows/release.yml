name: Create tagged OvGME release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment
        required: true
        default: minor
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: ovgme-release
  cancel-in-progress: false

jobs:
  release:
    uses: ScottyMac52/DCS-Common/.github/workflows/release.yml@main
    with:
      bump: ${{ inputs.bump }}
      install-lua-parser: true
      run-lua-parse: true
      extra-validation-command: npm run test:profile
      package-script: scripts/Build-OvGME.ps1
      test-package-script: scripts/Test-Package.ps1
      build-release-script: scripts/Build-Release.ps1
      test-release-script: scripts/Test-Release.ps1
      run-release-validation: true
      artifact-name: F4U-1D-Release-${{ inputs.bump }}-${{ github.run_number }}
      artifact-path: |
        dist/*.zip
        dist/SHA256SUMS.txt
      release-notes-path: packaging/release/RELEASE-NOTES.md
      kneeboard-paths: kneeboard/source kneeboard/F4U-1D
      release-title-prefix: DCS F4U-1D Corsair Components
    secrets: inherit
